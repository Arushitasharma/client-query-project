<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(120deg,#4a6cf7,#00c6ff);
        }

        .register-card{
            width:100%;
            max-width:500px;
            background:#f4f4f4;
            padding:60px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 20px 40px rgba(0,0,0,0.2);

            animation:fadeUp 0.7s ease;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .icon{
            width:90px;
            height:90px;
            border-radius:50%;
            background:linear-gradient(45deg,#4a6cf7,#00c6ff);
            margin:0 auto 30px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:45px;
            color:white;
        }

        h1{
            margin-bottom:15px;
            font-size:28px;
        }

        p{
            color:#666;
            margin-bottom:35px;
            font-size:18px;
        }

        input{
            width:100%;
            padding:16px;
            border:1px solid #ccc;
            border-radius:10px;
            margin-bottom:20px;
            font-size:16px;
            transition:0.3s;
        }

        input:focus{
            outline:none;
            border-color:#4a6cf7;
        }

        button{
            width:100%;
            padding:16px;
            border:none;
            border-radius:10px;
            background:linear-gradient(45deg,#4a6cf7,#00c6ff);
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.02);
            opacity:0.95;
        }

        .login-link{
            margin-top:25px;
            font-size:16px;
        }

        .login-link a{
            color:#4a6cf7;
            text-decoration:none;
        }

        .flash-message{
            background:#ffe5e5;
            color:#d8000c;
            padding:14px;
            border-radius:10px;
            margin-bottom:20px;
            font-size:15px;
        }

    </style>

</head>

<body>

    <div class="register-card">

        <div class="icon">
            📝
        </div>

        <h1>Create Account</h1>

        <p>Register to continue</p>


        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}
            {% endif %}
        {% endwith %}


        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <div class="login-link">

            Already have an account?
            <a href="/login">
                Login
            </a>

        </div>

    </div>

</body>

</html>
