<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Query Form</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4c63ff,#6a82fb);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:40px;
            width:500px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .flash-message{

            background:#d4edda;

            color:#155724;

            padding:15px;

            margin-bottom:20px;

            border-radius:10px;

            font-size:18px;

            text-align:center;
        }

        input,
        textarea{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border:1px solid #ccc;

            border-radius:10px;

            font-size:16px;
        }

        textarea{
            resize:none;
            height:120px;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            background:#4c63ff;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#374de0;
        }

        .top-links{
            display:flex;
            justify-content:space-between;
            margin-bottom:20px;
        }

        .top-links a{
            text-decoration:none;
            color:#4c63ff;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="top-links">

            <a href="/admin">Admin</a>

            <a href="/logout">Logout</a>

        </div>

        <h1>Client Query Form</h1>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form action="/submit" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <textarea
                name="query"
                placeholder="Enter your query"
                required
            ></textarea>

            <button type="submit">

                Submit Query

            </button>

        </form>

    </div>

</body>
</html>
