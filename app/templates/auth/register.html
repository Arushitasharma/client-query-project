{% extends "layouts/base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/auth.css') }}"
>

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Register to continue
        </p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">

                Register

            </button>

        </form>

        <div class="auth-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
