version: '3.9'

services:

  web:

    build: .

    ports:
      - "5000:5000"

    environment:
      - SECRET_KEY=mysecretkey123
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clientdb

    depends_on:
      - db

  db:

    image: postgres:15

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clientdb

    ports:
      - "5432:5432"